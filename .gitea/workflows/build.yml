name: Build and Release Gajim Calls

on:
  push:
  workflow_dispatch:

permissions: read-all

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test tools
        run: python -m pip install --upgrade pytest ruff

      - name: Lint
        run: ruff check gajim_calls tests scripts

      - name: Unit tests
        run: python -m pytest -q

      - name: Compile Python
        run: python -m compileall -q gajim_calls scripts tests

      - name: Build manual-install archive
        run: python scripts/build_plugin.py --output dist/gajim_calls.zip

      - name: Verify manual-install archive
        run: python scripts/verify_archive.py dist/gajim_calls.zip

      - name: Build Gajim updater repository
        run: python scripts/build_repository.py --output-dir dist/repository

      - name: Verify Gajim updater repository
        run: python scripts/verify_repository.py dist/repository

  webrtc-loopback:
    runs-on: ubuntu-latest
    env:
      GST_PACKAGES: >-
        python3-gi
        gir1.2-gstreamer-1.0
        gir1.2-gst-plugins-bad-1.0
        gstreamer1.0-plugins-base
        gstreamer1.0-plugins-good
        gstreamer1.0-plugins-bad
        gstreamer1.0-nice
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether real WebRTC integration is needed
        id: webrtc-scope
        shell: bash
        env:
          EVENT_NAME: ${{ gitea.event_name }}
          REF_NAME: ${{ gitea.ref }}
          BEFORE: ${{ gitea.event.before }}
        run: |
          set -euo pipefail

          # Releases are gated on this job, so every main push must exercise the
          # real GStreamer ICE/DTLS path. Manual runs should exercise it too.
          if [ "$EVENT_NAME" != "push" ] || [ "$REF_NAME" = "refs/heads/main" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE_SHA="$BEFORE"
          if [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            BEFORE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          # If the comparison cannot be made safely, run the integration test
          # rather than accidentally skipping coverage.
          if [ -z "$BEFORE_SHA" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! CHANGED_PATHS="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" 2>/dev/null)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$CHANGED_PATHS" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              docs/*|README.md|CONTRIBUTING.md|LICENSE|gajim_calls/gtk/*)
                ;;
              *)
                echo "run=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done <<< "$CHANGED_PATHS"

          echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Build GStreamer package cache key
        if: ${{ steps.webrtc-scope.outputs.run == 'true' }}
        id: gst-cache-key
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          PACKAGE_HASH="$(printf '%s' "$GST_PACKAGES" | sha256sum | cut -c1-16)"
          echo "key=${ID}-${VERSION_ID}-$(dpkg --print-architecture)-${PACKAGE_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore cached GStreamer packages
        if: ${{ steps.webrtc-scope.outputs.run == 'true' }}
        id: gst-cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/gstreamer-debs
          key: gstreamer-webrtc-debs-${{ steps.gst-cache-key.outputs.key }}

      - name: Download GStreamer WebRTC runtime
        if: ${{ steps.webrtc-scope.outputs.run == 'true' && steps.gst-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          CACHE_DIR="$PWD/.ci-cache/gstreamer-debs"
          mkdir -p "$CACHE_DIR/partial"
          sudo apt-get update
          sudo apt-get \
            -o Dir::Cache::archives="$CACHE_DIR" \
            install -y --no-install-recommends --download-only \
            $GST_PACKAGES
          test -n "$(find "$CACHE_DIR" -maxdepth 1 -name '*.deb' -print -quit)"

      - name: Install GStreamer WebRTC runtime from local packages
        if: ${{ steps.webrtc-scope.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          CACHE_DIR="$PWD/.ci-cache/gstreamer-debs"
          sudo apt-get install -y --no-install-recommends "$CACHE_DIR"/*.deb

      - name: Real ICE and DTLS loopback test
        if: ${{ steps.webrtc-scope.outputs.run == 'true' }}
        env:
          GST_DEBUG: "webrtc*:4,libnice*:4"
        run: /usr/bin/python3 tests/integration_webrtc.py

  release:
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    needs:
      - test-and-package
      - webrtc-loopback
    runs-on: ubuntu-latest
    permissions:
      code: write
      releases: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("gajim_calls/plugin-manifest.json").read_text(encoding="utf-8"))
          version = str(manifest["version"])
          if not version or any(char.isspace() or char in "/\\" for char in version):
              raise SystemExit(f"Unsafe plugin version: {version!r}")
          print(version)
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide whether this version needs publishing
        id: publish
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG_SHA="$(git rev-list -n 1 "$TAG" 2>/dev/null || true)"
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "Version $TAG already belongs to $TAG_SHA; bump the manifest version."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATUS="$(curl -sS -o /tmp/release.json -w '%{http_code}' \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Accept: application/json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          if [ "$STATUS" = "200" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "existing=true" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" = "404" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "existing=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/release.json || true
            exit 1
          fi

      - name: Build release files
        if: ${{ steps.publish.outputs.publish == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/build_plugin.py --output "dist/gajim_calls-$VERSION.zip"
          python scripts/verify_archive.py "dist/gajim_calls-$VERSION.zip"
          python scripts/build_repository.py --output-dir dist/repository
          python scripts/verify_repository.py dist/repository

      - name: Create or reuse Gitea release
        if: ${{ steps.publish.outputs.publish == 'true' }}
        id: release
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          EXISTING: ${{ steps.publish.outputs.existing }}
        run: |
          set -euo pipefail
          if [ "$EXISTING" = "true" ]; then
            cp /tmp/release.json /tmp/published-release.json
          else
            TAG="$TAG" VERSION="$VERSION" SHA="$GITHUB_SHA" python - <<'PY' > /tmp/release-payload.json
          import json
          import os
          import sys
          json.dump({
              "tag_name": os.environ["TAG"],
              "target_commitish": os.environ["SHA"],
              "name": f"Gajim Calls {os.environ['TAG']}",
              "body": f"Download **gajim_calls-{os.environ['VERSION']}.zip** and install it from Gajim's Plugins window.",
              "draft": False,
              "prerelease": False,
          }, sys.stdout)
          PY
            curl -fsS -X POST \
              -H "Authorization: token $GITEA_TOKEN" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/release-payload.json \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" \
              > /tmp/published-release.json
          fi
          RELEASE_ID="$(python -c 'import json; print(json.load(open("/tmp/published-release.json"))["id"])')"
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload the single plugin release asset
        if: ${{ steps.publish.outputs.publish == 'true' }}
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ASSET="dist/gajim_calls-${VERSION}.zip"
          NAME="$(basename "$ASSET")"
          ASSETS_JSON="$(curl -fsS \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Accept: application/json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets")"
          EXISTING_ID="$(printf '%s' "$ASSETS_JSON" | python -c 'import json,sys; n=sys.argv[1]; print(next((str(a["id"]) for a in json.load(sys.stdin) if a["name"] == n), ""))' "$NAME")"
          if [ -n "$EXISTING_ID" ]; then
            curl -fsS -X DELETE \
              -H "Authorization: token $GITEA_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets/$EXISTING_ID"
          fi
          curl -fsS -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Accept: application/json" \
            -F "attachment=@$ASSET" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$NAME" \
            > /dev/null

      - name: Publish Gajim plugin repository branch
        if: ${{ steps.publish.outputs.publish == 'true' }}
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          PUBLISH_DIR="$(mktemp -d)"
          if git ls-remote --exit-code --heads origin plugin-repository >/dev/null 2>&1; then
            git fetch origin plugin-repository:refs/remotes/origin/plugin-repository
            git worktree add -B plugin-repository "$PUBLISH_DIR" origin/plugin-repository
          else
            git worktree add --detach "$PUBLISH_DIR" "$GITHUB_SHA"
            git -C "$PUBLISH_DIR" checkout --orphan plugin-repository
            git -C "$PUBLISH_DIR" rm -rf . >/dev/null 2>&1 || true
          fi
          python scripts/build_repository.py --output-dir "$PUBLISH_DIR"
          python scripts/verify_repository.py "$PUBLISH_DIR"
          git -C "$PUBLISH_DIR" config user.name "gitea-actions"
          git -C "$PUBLISH_DIR" config user.email "actions@localhost"
          git -C "$PUBLISH_DIR" add -A
          if ! git -C "$PUBLISH_DIR" diff --cached --quiet; then
            git -C "$PUBLISH_DIR" commit -m "Publish Gajim Calls $TAG"
            git -C "$PUBLISH_DIR" push origin HEAD:plugin-repository
          fi
